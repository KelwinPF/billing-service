# ============================================
# APPLICATION
# ============================================
spring.application.name=billing-service
server.port=8081

# ============================================
# KAFKA CONSUMER
# ============================================
# Endereço do broker Kafka (docker-compose)
spring.kafka.bootstrap-servers=localhost:9092

# Serialização: recebe objetos JSON e converte para Java
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuração do deserializador JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=OrderCreatedEvent:com.tcc.billing.event.OrderCreatedEvent

# Group ID: identifica este consumidor no Kafka
spring.kafka.consumer.group-id=billing-service-group

# Offset: earliest = lê desde o início se não houver offset salvo
spring.kafka.consumer.auto-offset-reset=earliest

# Commit automático de offsets
spring.kafka.consumer.enable-auto-commit=true

# ============================================
# KAFKA PRODUCER
# ============================================
# Serialização: envia objetos Java como JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Confirmação de escrita: all = espera confirmação de todos os replicas (mais seguro)
spring.kafka.producer.acks=all

# ============================================
# BILLING SIMULATION (Experimental)
# ============================================
# Simulação de falha: ativa falha proposital no processamento
# Valores: true | false
billing.simulation.failure.enabled=false

# Simulação de latência: ativa delay artificial no processamento
# Valores: true | false
billing.simulation.latency.enabled=false

# Tempo de latência simulada em milissegundos
# Padrão: 1000ms (1 segundo)
# Valores recomendados: 500, 1000, 2000, 5000
billing.simulation.latency.ms=1000

# ============================================
# LOGGING
# ============================================
# Logs estruturados para facilitar análise
logging.level.root=INFO
logging.level.com.tcc.billing=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# DATABASE (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hybrid_db
spring.datasource.username=hybrid_user
spring.datasource.password=hybrid_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=billing

# ============================================
# ACTUATOR (métricas e health)# ============================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=billing-service

# Kafka metrics
spring.kafka.listener.log-container-config=true
management.metrics.enable.kafka=true

# ============================================
# KAFKA RETRY E DLQ (Dead Letter Queue)
# ============================================
# Número máximo de tentativas antes de enviar para DLQ
kafka.retry.max-attempts=3

# Intervalo entre tentativas (em milissegundos)
kafka.retry.backoff-ms=1000
